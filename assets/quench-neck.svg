<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Diagram of the Quench neck standard: roasted maple or mahogany, profile made to your spec, frets leveled and crowned by hand, set up to your measurements">
<title>Quench neck standard</title>
<defs>
 <radialGradient id="bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1f1c17"/><stop offset="1" stop-color="#070708"/></radialGradient>
 <clipPath id="profile"><path d="M297.0 150 H503.0 V200 C503.0 300 443.0 330 400 334 C357.0 330 297.0 300 297.0 200 Z"/></clipPath>
 <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a211b"/><stop offset="1" stop-color="#0b0807"/></linearGradient>
 <linearGradient id="nk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f5a2c"/><stop offset=".5" stop-color="#b57a40"/><stop offset="1" stop-color="#8f5a2c"/></linearGradient>
</defs>
<rect width="800" height="560" fill="url(#bg)"/>
<g clip-path="url(#profile)"><rect x="297.0" y="150" width="206.0" height="200" fill="url(#nk)"/></g>
<path d="M297.0 150 H503.0 V200 C503.0 300 443.0 330 400 334 C357.0 330 297.0 300 297.0 200 Z" fill="none" stroke="#c9a35c" stroke-width="1.5"/>
<rect x="293.0" y="128" width="214.0" height="22" fill="url(#fb)" stroke="#c9a35c" stroke-width="1"/>
<rect x="392" y="196" width="16" height="48" rx="3" fill="#0a0a0b" stroke="#8a8a8e"/>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#b9b4aa" letter-spacing="1">
 <line x1="511.0" y1="139" x2="640" y2="110" stroke="#c9a35c" stroke-opacity=".6"/><text x="648" y="106">FRETS LEVELED &amp;</text><text x="648" y="124">CROWNED BY HAND</text>
 <line x1="483.0" y1="210" x2="640" y2="200" stroke="#c9a35c" stroke-opacity=".6"/><text x="648" y="196">SET UP TO YOUR</text><text x="648" y="214">MEASUREMENTS</text>
 <line x1="408" y1="220" x2="640" y2="290" stroke="#c9a35c" stroke-opacity=".6"/><text x="648" y="294">TRUSS ROD</text>
 <line x1="327.0" y1="230" x2="160" y2="200" stroke="#c9a35c" stroke-opacity=".6"/><text x="152" y="196" text-anchor="end">ROASTED MAPLE</text><text x="152" y="214" text-anchor="end">OR MAHOGANY</text>
 <line x1="317.0" y1="300" x2="160" y2="330" stroke="#c9a35c" stroke-opacity=".6"/><text x="152" y="334" text-anchor="end">PROFILE MADE</text><text x="152" y="352" text-anchor="end">TO YOUR SPEC</text>
</g>
<g font-family="Inter, Helvetica, Arial, sans-serif" fill="#c9a35c" font-size="13" letter-spacing="4" text-anchor="middle">
 <text x="400" y="440">SPEC  ·  FRETWORK  ·  FINISH  ·  SETUP</text>
</g>
</svg>